<style>
    .theme-toggle-btn {
        width: 38px;
        height: 30px;
        padding: 0;
        margin: 0;
        box-sizing: border-box;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        background-color: #f0f2f5;
        border: 1px solid #4b5563;
        border-radius: 6px;

        color: #374151;

        cursor: pointer;
        outline: none;
        transition: all 0.2s ease;
    }


    .theme-toggle-btn:hover {
        background-color: #e5e7eb;
        color: #111827;
        border-color: #374151;
    }

    .theme-toggle-btn:active {
        transform: scale(0.94);
    }

    .theme-toggle-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
    }
</style>

<style class="theme-dark" media="(prefers-color-scheme: dark)">
    .theme-toggle-btn {
        background-color: #2b2f36;
        border-color: #434955;
        color: #e5e7eb;
    }

    .theme-toggle-btn:hover {
        background-color: #373d47;
        color: #ffffff;
        border-color: #6b7280;
    }
</style>

<button id="theme-toggle" class="theme-toggle-btn" aria-label="切换主题" title="主题模式"></button>

<script>
    const ICONS = {
        // 自动模式：左边半太阳 + 右边半月亮
        auto: `
      <svg viewBox="0 0 24 24">
        <!-- 左半太阳 -->
        <path d="M12 8a4 4 0 0 0 0 8"></path>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <!-- 右半月亮 -->
        <path d="M12 4a8 8 0 0 1 0 16 5.5 5.5 0 0 0 0-16z"></path>
      </svg>
    `,
        // 明亮模式：太阳
        light: `
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
        <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
      </svg>
    `,
        // 黑暗模式：月亮
        dark: `
      <svg viewBox="0 0 24 24">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    `
    };

    const THEME_MODES = ['auto', 'light', 'dark'];
    const THEME_TITLES = {
        auto: '跟随系统 (Auto)',
        light: '明亮模式 (Light)',
        dark: '黑暗模式 (Dark)'
    };

    const btn = document.getElementById('theme-toggle');

    // 应用主题并更新按钮 UI
    function applyTheme(mode) {
        const darkStyles = document.querySelectorAll('.theme-dark');
        darkStyles.forEach(darkStyle => {
            if (mode === 'light') {
                darkStyle.media = 'not all';
                darkStyle.disabled = true;
            } else if (mode === 'dark') {
                darkStyle.media = 'all';
                darkStyle.disabled = false;
            } else {
                darkStyle.media = '(prefers-color-scheme: dark)';
                darkStyle.disabled = false;
            }
        });

        // 更新按钮内部图标及提示
        btn.innerHTML = ICONS[mode];
        btn.title = THEME_TITLES[mode];
        localStorage.setItem('user-theme', mode);
    }

    // 点击按钮在 auto -> light -> dark 之间循环
    btn.addEventListener('click', () => {
        const currentMode = localStorage.getItem('user-theme') || 'auto';
        const nextIndex = (THEME_MODES.indexOf(currentMode) + 1) % THEME_MODES.length;
        applyTheme(THEME_MODES[nextIndex]);
    });

    // 初始化加载上次选择的主题
    const initialMode = localStorage.getItem('user-theme') || 'auto';
    applyTheme(initialMode);
</script>

<!-- 将主题切换按钮放置在第一个选项卡的左侧 -->
<script>
    const firstTab = document.querySelector('#topMenu ul li') || document.querySelector('#topMenu li');
    const themeToggle = document.getElementById('theme-toggle');

    if (firstTab && themeToggle) {
        // 绝对定位，放置在第一个选项卡的左侧
        themeToggle.style.cssText = `
        position: absolute;
        right: 100%;
        top: 50%;
        transform: translateY(-50%);
        margin-right: 10px;
        z-index: 999;
        display: flex;
        align-items: center;
    `;

        firstTab.appendChild(themeToggle);
    }
</script>
