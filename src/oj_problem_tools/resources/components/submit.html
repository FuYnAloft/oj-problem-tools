<script>
(async function fetchAndInsertSubmitForm() {
  const style = `<style>
  #submit {
    float: none !important;
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
  }

  #solution_submit > dl {
    margin: 0 !important;
  }

  #submit dt {
    float: none !important;
    width: auto !important;
    min-height: 0 !important;
    line-height: 1.5 !important;
    margin: 16px 0 8px !important;
    padding: 0 !important;
    text-align: left !important;
    font-style: normal !important;
    font-weight: 600;
  }

  #submit dd {
    margin: 0 !important;
    padding: 0 !important;
  }

  #submit .oj-language-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    margin-left: 24px;
  }

  #submit .oj-language-option {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    cursor: pointer;
  }

  #submit .oj-language-option input[type="radio"] {
    flex: none;
    margin: 0;
  }

  #submit dd textarea {
    box-sizing: border-box;
    width: 100% !important;
    padding: 12px;
    resize: vertical;
    border-radius: 6px;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    tab-size: 4;
  }

  #submit .submit-button {
    display: block;
    width: 100px;
    max-width: 100%;
    margin: 10px auto 0 !important;
    padding: 8px 24px !important;
    font-weight: 600;
  }

  #submit .submit-button:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }
</style>`;

  function encodeUtf8Base64(value) {
    const bytes = new TextEncoder().encode(value);
    const chunkSize = 0x8000;
    let binary = '';
    for (let offset = 0; offset < bytes.length; offset += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
    }
    return btoa(binary);
  }

  function scrollToSubmissionStatus() {
    const section = document.getElementById('oj-inject-submission-status');
    if (!section) return;

    const bounds = section.getBoundingClientRect();
    if (bounds.bottom <= window.innerHeight) return;

    const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    section.scrollIntoView({
      behavior: reduceMotion ? 'auto' : 'smooth',
      block: 'end'
    });
  }

  function latestSubmissionKey() {
    const firstRow = document.querySelector(
      '#oj-inject-submission-status table.my-solutions tbody tr'
    );
    if (!firstRow) return null;

    const numberLink = firstRow.querySelector('td.no a');
    return numberLink?.href || numberLink?.textContent.trim() || null;
  }

  async function waitForNewSubmission(previousKey) {
    const refresh = window.ojInjectRefreshSubmissionStatus;
    if (typeof refresh !== 'function') {
      console.error('提交成功，但未找到提交记录刷新函数');
      return;
    }

    const deadline = Date.now() + 5000;
    while (true) {
      try {
        await refresh();
      } catch {
        // 刷新函数已记录错误；在等待窗口内继续尝试。
      }

      const currentKey = latestSubmissionKey();
      if (currentKey && currentKey !== previousKey) return;

      const remaining = deadline - Date.now();
      if (remaining <= 0) return;
      await new Promise(resolve => setTimeout(resolve, Math.min(1000, remaining)));
      if (Date.now() >= deadline) return;
    }
  }

  function arrangeLanguageOptions(submitRoot, ownerDocument) {
    const radios = Array.from(
      submitRoot.querySelectorAll('input[type="radio"][name="language"]')
    );
    if (!radios.length) return;

    const container = radios[0].closest('dd');
    if (!container) return;

    const options = ownerDocument.createElement('div');
    options.className = 'oj-language-options';

    radios.forEach(radio => {
      const labelParts = [];
      let sibling = radio.nextSibling;
      while (sibling && !(sibling.nodeType === 1 && sibling.tagName === 'BR')) {
        const next = sibling.nextSibling;
        labelParts.push(sibling.textContent || '');
        sibling.remove();
        sibling = next;
      }
      if (sibling && sibling.nodeType === 1 && sibling.tagName === 'BR') {
        sibling.remove();
      }

      const label = ownerDocument.createElement('label');
      label.className = 'oj-language-option';
      radio.replaceWith(label);
      label.append(radio, ownerDocument.createTextNode(labelParts.join('').trim()));
      options.appendChild(label);
    });

    container.replaceChildren(options);
  }

  function bindSubmitForm(form) {
    const submitButton = form.querySelector('button[type="submit"], input[type="submit"]');
    let submitInFlight = false;

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (submitInFlight) return;

      const sourceInput = form.querySelector('[name="source"]');
      if (!sourceInput || sourceInput.value.trim() === '') {
        alert('source can not be empty');
        return;
      }

      const previousSubmissionKey = latestSubmissionKey();
      submitInFlight = true;
      if (submitButton) submitButton.disabled = true;
      const minimumLock = new Promise(resolve => setTimeout(resolve, 3000));

      try {
        const body = new URLSearchParams();
        new FormData(form).forEach((value, name) => {
          if (typeof value === 'string') body.append(name, value);
        });
        body.set('source', encodeUtf8Base64(sourceInput.value));

        const response = await fetch(form.action, {
          method: (form.method || 'POST').toUpperCase(),
          credentials: 'same-origin',
          body
        });
        if (!response.ok) throw new Error(`Fetch 失败: ${response.status}`);

        waitForNewSubmission(previousSubmissionKey).finally(scrollToSubmissionStatus);
      } catch (error) {
        console.error('提交失败:', error);
      } finally {
        await minimumLock;
        submitInFlight = false;
        if (submitButton) submitButton.disabled = false;
      }
    });
  }

  try {
    const pageUrl = new URL(window.location.href);
    pageUrl.search = '';
    pageUrl.hash = '';
    pageUrl.pathname = pageUrl.pathname.replace(/\/?$/, '/submit/');

    const response = await fetch(pageUrl);
    if (!response.ok) throw new Error(`Fetch 失败: ${response.status}`);

    const htmlText = await response.text();
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    const targetSubmit = doc.querySelector('#submit');
    if (!targetSubmit) throw new Error('目标页面中未找到 #submit');

    targetSubmit.classList.remove('col-9');
    targetSubmit.querySelectorAll('p').forEach(paragraph => paragraph.remove());
    targetSubmit.querySelector('.submit-reset')?.remove();
    targetSubmit.querySelectorAll('dt').forEach(term => {
      if (!term.textContent.trim()) term.remove();
    });

    const sourceEncode = targetSubmit.querySelector('dd > input[name="sourceEncode"]');
    const targetForm = targetSubmit.querySelector('#solution_submit');
    if (sourceEncode && targetForm) {
      const wrapper = sourceEncode.parentElement;
      targetForm.prepend(sourceEncode);
      wrapper.remove();
    }
    arrangeLanguageOptions(targetSubmit, doc);

    const combinedHtml = '<h2>提交</h2>' + style + targetSubmit.outerHTML;
    const range = document.createRange();
    const fragment = range.createContextualFragment(combinedHtml);
    const submitForm = fragment.querySelector('#solution_submit');
    if (!submitForm) throw new Error('提交页面中未找到 #solution_submit 表单');

    const markdownBody = document.querySelector('div.markdown-body');
    if (!markdownBody) throw new Error('当前页面未找到 div.markdown-body');

    markdownBody.appendChild(fragment);
    bindSubmitForm(submitForm);
  } catch (error) {
    console.error('加载提交控件失败:', error);
  }
})();
</script>
