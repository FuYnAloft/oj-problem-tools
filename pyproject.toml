[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "oj-problem-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "latex2mathml>=3.81.1",
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.0",
]
