[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "oj-problems"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "latex2mathml>=3.81.1",
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oj_problem_tools"]
